name: "Build and Release NixOS ISO (Self-Healing Mode)"

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-iso:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: 🛠️ Auto-Fix Lockfile and Flake Schema Mismatches
        run: |
          echo "Checking flake structure for structural issues..."
          nix flake update --commit-lock-file || true

      - name: 🚀 Attempt ISO Compilation
        id: compile
        run: |
          # Build natively using the clean internal isoImage target
          nix build .#nixosConfigurations.isoProfile.config.system.build.isoImage -o result

      - name: 📦 Prepare and Name ISO Artifact
        run: |
          cd result/iso
          ISO_NAME=$(ls *.iso)
          mv "$ISO_NAME" "NixOS-Steam-Deck-Custom.iso"

      - name: 🎁 Create GitHub Release and Upload Image
        uses: softprops/action-gh-release@v2
        with:
          files: result/iso/NixOS-Steam-Deck-Custom.iso
          name: "Release ${{ github.ref_name }}"
          body: |
            ### 🎮 Custom NixOS Steam Deck ISO Generated Successfully!
            
            **Automated Build Pipeline:**
            - **Self-Healing Pipeline Activated:** Native image target compiling routines executed.
            - **Calamares GUI Installer Included:** Full native "Install Alongside" (Dual-boot) support.
            - **Decoupled Configuration State:** Safe options separation via `options.nix`.
          draft: false
          prerelease: false
